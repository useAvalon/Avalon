name: Canary Release

# Publishes npm canaries for changed packages only. Each package gets its own
# version (next patch + -canary.N where N is per-package on npm) and its own
# GitHub pre-release tag (e.g. avalon/v0.5.3-canary.4), matching stable release.yml.
# Test-only and README-only edits under a package do not publish.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish a canary for (manual run)"
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - lit
          - react
          - preact
          - svelte
          - solid
          - vue
          - qwik
          - mcp
          - seo
          - create-avalon
          - agent-optimization

permissions:
  contents: write
  id-token: write

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.resolve.outputs.core }}
      lit: ${{ steps.resolve.outputs.lit }}
      react: ${{ steps.resolve.outputs.react }}
      preact: ${{ steps.resolve.outputs.preact }}
      svelte: ${{ steps.resolve.outputs.svelte }}
      solid: ${{ steps.resolve.outputs.solid }}
      vue: ${{ steps.resolve.outputs.vue }}
      qwik: ${{ steps.resolve.outputs.qwik }}
      mcp: ${{ steps.resolve.outputs.mcp }}
      seo: ${{ steps.resolve.outputs.seo }}
      create_avalon: ${{ steps.resolve.outputs.create_avalon }}
      agent_optimization: ${{ steps.resolve.outputs.agent_optimization }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: changes
        if: github.event_name == 'push'
        with:
          # Exclusions: test-only and README edits must not publish npm canaries.
          filters: |
            core:
              - 'packages/avalon/**'
              - 'packages/integrations/core/**'
              - '!packages/avalon/**/__tests__/**'
              - '!packages/avalon/**/tests/**'
              - '!packages/avalon/**/*.test.ts'
              - '!packages/avalon/**/*.test.tsx'
              - '!packages/avalon/**/*.test.mjs'
              - '!packages/avalon/**/README.md'
              - '!packages/integrations/core/**/__tests__/**'
              - '!packages/integrations/core/**/tests/**'
              - '!packages/integrations/core/**/*.test.ts'
              - '!packages/integrations/core/**/*.test.tsx'
              - '!packages/integrations/core/**/*.test.mjs'
              - '!packages/integrations/core/**/README.md'
            lit:
              - 'packages/integrations/lit/**'
              - '!packages/integrations/lit/**/__tests__/**'
              - '!packages/integrations/lit/**/tests/**'
              - '!packages/integrations/lit/**/*.test.ts'
              - '!packages/integrations/lit/**/*.test.tsx'
              - '!packages/integrations/lit/**/*.test.mjs'
              - '!packages/integrations/lit/**/README.md'
            react:
              - 'packages/integrations/react/**'
              - '!packages/integrations/react/**/__tests__/**'
              - '!packages/integrations/react/**/tests/**'
              - '!packages/integrations/react/**/*.test.ts'
              - '!packages/integrations/react/**/*.test.tsx'
              - '!packages/integrations/react/**/*.test.mjs'
              - '!packages/integrations/react/**/README.md'
            preact:
              - 'packages/integrations/preact/**'
              - '!packages/integrations/preact/**/__tests__/**'
              - '!packages/integrations/preact/**/tests/**'
              - '!packages/integrations/preact/**/*.test.ts'
              - '!packages/integrations/preact/**/*.test.tsx'
              - '!packages/integrations/preact/**/*.test.mjs'
              - '!packages/integrations/preact/**/README.md'
            svelte:
              - 'packages/integrations/svelte/**'
              - '!packages/integrations/svelte/**/__tests__/**'
              - '!packages/integrations/svelte/**/tests/**'
              - '!packages/integrations/svelte/**/*.test.ts'
              - '!packages/integrations/svelte/**/*.test.tsx'
              - '!packages/integrations/svelte/**/*.test.mjs'
              - '!packages/integrations/svelte/**/README.md'
            solid:
              - 'packages/integrations/solid/**'
              - '!packages/integrations/solid/**/__tests__/**'
              - '!packages/integrations/solid/**/tests/**'
              - '!packages/integrations/solid/**/*.test.ts'
              - '!packages/integrations/solid/**/*.test.tsx'
              - '!packages/integrations/solid/**/*.test.mjs'
              - '!packages/integrations/solid/**/README.md'
            vue:
              - 'packages/integrations/vue/**'
              - '!packages/integrations/vue/**/__tests__/**'
              - '!packages/integrations/vue/**/tests/**'
              - '!packages/integrations/vue/**/*.test.ts'
              - '!packages/integrations/vue/**/*.test.tsx'
              - '!packages/integrations/vue/**/*.test.mjs'
              - '!packages/integrations/vue/**/README.md'
            qwik:
              - 'packages/integrations/qwik/**'
              - '!packages/integrations/qwik/**/__tests__/**'
              - '!packages/integrations/qwik/**/tests/**'
              - '!packages/integrations/qwik/**/*.test.ts'
              - '!packages/integrations/qwik/**/*.test.tsx'
              - '!packages/integrations/qwik/**/*.test.mjs'
              - '!packages/integrations/qwik/**/README.md'
            mcp:
              - 'packages/mcp/**'
              - '!packages/mcp/**/__tests__/**'
              - '!packages/mcp/**/tests/**'
              - '!packages/mcp/**/*.test.ts'
              - '!packages/mcp/**/*.test.tsx'
              - '!packages/mcp/**/*.test.mjs'
              - '!packages/mcp/**/README.md'
            seo:
              - 'packages/seo/**'
              - '!packages/seo/**/__tests__/**'
              - '!packages/seo/**/tests/**'
              - '!packages/seo/**/*.test.ts'
              - '!packages/seo/**/*.test.tsx'
              - '!packages/seo/**/*.test.mjs'
              - '!packages/seo/**/README.md'
            create_avalon:
              - 'packages/create-avalon/**'
              - '!packages/create-avalon/**/__tests__/**'
              - '!packages/create-avalon/**/tests/**'
              - '!packages/create-avalon/**/*.test.ts'
              - '!packages/create-avalon/**/*.test.tsx'
              - '!packages/create-avalon/**/*.test.mjs'
              - '!packages/create-avalon/**/README.md'
            agent_optimization:
              - 'packages/agent-optimization/**'
              - '!packages/agent-optimization/**/__tests__/**'
              - '!packages/agent-optimization/**/tests/**'
              - '!packages/agent-optimization/**/*.test.ts'
              - '!packages/agent-optimization/**/*.test.tsx'
              - '!packages/agent-optimization/**/*.test.mjs'
              - '!packages/agent-optimization/**/README.md'
      - name: Resolve publish targets
        id: resolve
        env:
          SELECTION: ${{ inputs.packages }}
          EVENT_NAME: ${{ github.event_name }}
          CH_CORE: ${{ steps.changes.outputs.core }}
          CH_LIT: ${{ steps.changes.outputs.lit }}
          CH_REACT: ${{ steps.changes.outputs.react }}
          CH_PREACT: ${{ steps.changes.outputs.preact }}
          CH_SVELTE: ${{ steps.changes.outputs.svelte }}
          CH_SOLID: ${{ steps.changes.outputs.solid }}
          CH_VUE: ${{ steps.changes.outputs.vue }}
          CH_QWIK: ${{ steps.changes.outputs.qwik }}
          CH_MCP: ${{ steps.changes.outputs.mcp }}
          CH_SEO: ${{ steps.changes.outputs.seo }}
          CH_CREATE_AVALON: ${{ steps.changes.outputs.create_avalon }}
          CH_AGENT_OPTIMIZATION: ${{ steps.changes.outputs.agent_optimization }}
        run: |
          set -euo pipefail
          declare -A VAL
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            for p in core lit react preact svelte solid vue qwik mcp seo create-avalon agent-optimization; do
              if [ "$SELECTION" = "all" ] || [ "$SELECTION" = "$p" ]; then
                VAL[$p]=true
              else
                VAL[$p]=false
              fi
            done
          else
            VAL[core]="${CH_CORE:-false}"
            VAL[lit]="${CH_LIT:-false}"
            VAL[react]="${CH_REACT:-false}"
            VAL[preact]="${CH_PREACT:-false}"
            VAL[svelte]="${CH_SVELTE:-false}"
            VAL[solid]="${CH_SOLID:-false}"
            VAL[vue]="${CH_VUE:-false}"
            VAL[qwik]="${CH_QWIK:-false}"
            VAL[mcp]="${CH_MCP:-false}"
            VAL[seo]="${CH_SEO:-false}"
            VAL[create-avalon]="${CH_CREATE_AVALON:-false}"
            VAL[agent-optimization]="${CH_AGENT_OPTIMIZATION:-false}"
          fi

          ANY=false
          echo "core=${VAL[core]:-false}" >> "$GITHUB_OUTPUT"
          echo "lit=${VAL[lit]:-false}" >> "$GITHUB_OUTPUT"
          echo "react=${VAL[react]:-false}" >> "$GITHUB_OUTPUT"
          echo "preact=${VAL[preact]:-false}" >> "$GITHUB_OUTPUT"
          echo "svelte=${VAL[svelte]:-false}" >> "$GITHUB_OUTPUT"
          echo "solid=${VAL[solid]:-false}" >> "$GITHUB_OUTPUT"
          echo "vue=${VAL[vue]:-false}" >> "$GITHUB_OUTPUT"
          echo "qwik=${VAL[qwik]:-false}" >> "$GITHUB_OUTPUT"
          echo "mcp=${VAL[mcp]:-false}" >> "$GITHUB_OUTPUT"
          echo "seo=${VAL[seo]:-false}" >> "$GITHUB_OUTPUT"
          echo "create_avalon=${VAL[create-avalon]:-false}" >> "$GITHUB_OUTPUT"
          echo "agent_optimization=${VAL[agent-optimization]:-false}" >> "$GITHUB_OUTPUT"
          for p in core lit react preact svelte solid vue qwik mcp seo create-avalon agent-optimization; do
            if [ "${VAL[$p]:-false}" = "true" ]; then ANY=true; fi
          done
          echo "any=${ANY}" >> "$GITHUB_OUTPUT"

  canary:
    name: Publish Canary
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: npm install -g npm@^11.5.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - name: Bump and publish changed packages
        id: publish
        env:
          PUB_CORE: ${{ needs.detect-changes.outputs.core }}
          PUB_LIT: ${{ needs.detect-changes.outputs.lit }}
          PUB_REACT: ${{ needs.detect-changes.outputs.react }}
          PUB_PREACT: ${{ needs.detect-changes.outputs.preact }}
          PUB_SVELTE: ${{ needs.detect-changes.outputs.svelte }}
          PUB_SOLID: ${{ needs.detect-changes.outputs.solid }}
          PUB_VUE: ${{ needs.detect-changes.outputs.vue }}
          PUB_QWIK: ${{ needs.detect-changes.outputs.qwik }}
          PUB_MCP: ${{ needs.detect-changes.outputs.mcp }}
          PUB_SEO: ${{ needs.detect-changes.outputs.seo }}
          PUB_CREATE_AVALON: ${{ needs.detect-changes.outputs.create_avalon }}
          PUB_AGENT_OPTIMIZATION: ${{ needs.detect-changes.outputs.agent_optimization }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN
          rm -f ~/.npmrc

          next_patch() {
            local base="$1"
            local maj min pat
            IFS=. read -r maj min pat <<< "$base"
            echo "${maj}.${min}.$((pat + 1))"
          }

          max_published_canary_n() {
            local cfg="$1"
            [ -f "$cfg" ] || { echo -1; return; }
            local name base
            name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$cfg','utf-8')).name)")
            base=$(node -e "
              const v = JSON.parse(require('fs').readFileSync('$cfg','utf-8')).version.split('-')[0];
              const [a, b, c] = v.split('.').map(Number);
              console.log(\`\${a}.\${b}.\${c + 1}\`);
            ")
            npm view "$name" versions --json 2>/dev/null | node -e "
              const base = process.argv[1];
              let s = '';
              process.stdin.on('data', (d) => (s += d)).on('end', () => {
                let v;
                try { v = JSON.parse(s); } catch { v = []; }
                if (!Array.isArray(v)) v = v ? [v] : [];
                const re = new RegExp('^' + base.replace(/\./g, '\\\\.') + '-canary\\\\.(\\\\d+)\$');
                const ns = v.map((x) => { const m = re.exec(x); return m ? +m[1] : -1; }).filter((n) => n >= 0);
                console.log(ns.length ? Math.max(...ns) : -1);
              });
            " "$base"
          }

          : > published-package-dirs.txt

          publish_pkg() {
            local CONFIG="$1"
            if [ ! -f "$CONFIG" ]; then
              return
            fi
            local BASE_VERSION N CANARY_VERSION PKG_NAME PKG_DIR
            BASE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CONFIG','utf-8')).version.split('-')[0])")
            N=$(max_published_canary_n "$CONFIG")
            N=$((N + 1))
            CANARY_VERSION="$(next_patch "$BASE_VERSION")-canary.${N}"
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('$CONFIG','utf-8'));
              config.version = '${CANARY_VERSION}';
              fs.writeFileSync('$CONFIG', JSON.stringify(config, null, '\t') + '\n');
            "
            PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CONFIG','utf-8')).name)")
            if npm view "${PKG_NAME}@${CANARY_VERSION}" version >/dev/null 2>&1; then
              echo "Skip: ${PKG_NAME}@${CANARY_VERSION} already published"
              return
            fi
            echo "Publishing ${PKG_NAME}@${CANARY_VERSION}"
            PKG_DIR=$(dirname "$CONFIG")
            cd "$PKG_DIR"
            npm publish --tag canary --access public
            cd - > /dev/null
            echo "$PKG_DIR" >> published-package-dirs.txt
          }

          if [ "$PUB_CORE" = "true" ]; then
            publish_pkg "packages/integrations/core/package.json"
            publish_pkg "packages/avalon/package.json"
          fi
          if [ "$PUB_LIT" = "true" ]; then
            publish_pkg "packages/integrations/lit/package.json"
          fi
          if [ "$PUB_REACT" = "true" ]; then
            publish_pkg "packages/integrations/react/package.json"
          fi
          if [ "$PUB_PREACT" = "true" ]; then
            publish_pkg "packages/integrations/preact/package.json"
          fi
          if [ "$PUB_SVELTE" = "true" ]; then
            publish_pkg "packages/integrations/svelte/package.json"
          fi
          if [ "$PUB_SOLID" = "true" ]; then
            publish_pkg "packages/integrations/solid/package.json"
          fi
          if [ "$PUB_VUE" = "true" ]; then
            publish_pkg "packages/integrations/vue/package.json"
          fi
          if [ "$PUB_QWIK" = "true" ]; then
            publish_pkg "packages/integrations/qwik/package.json"
          fi
          if [ "$PUB_MCP" = "true" ]; then
            publish_pkg "packages/mcp/package.json"
          fi
          if [ "$PUB_SEO" = "true" ]; then
            publish_pkg "packages/seo/package.json"
          fi
          if [ "$PUB_CREATE_AVALON" = "true" ]; then
            publish_pkg "packages/create-avalon/package.json"
          fi
          if [ "$PUB_AGENT_OPTIMIZATION" = "true" ]; then
            publish_pkg "packages/agent-optimization/package.json"
          fi

          if [ ! -s published-package-dirs.txt ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create per-package canary tags and GitHub pre-releases
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            if [ ! -f "$pkg/package.json" ]; then
              continue
            fi
            NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$pkg/package.json','utf-8')).name)")
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$pkg/package.json','utf-8')).version)")
            SHORT_NAME="${NAME##*/}"
            TAG_NAME="${SHORT_NAME}/v${VERSION}"

            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists — skipping"
              continue
            fi

            echo "Creating canary release $NAME@$VERSION (tag $TAG_NAME)"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"

            gh release create "$TAG_NAME" \
              --title "${NAME}@${VERSION}" \
              --generate-notes \
              --prerelease
          done < published-package-dirs.txt
