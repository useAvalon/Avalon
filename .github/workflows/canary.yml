name: Canary Release

# Publishes a canary release on every push to main that touches packages.
#
# Model (Next.js style):
# - A single "release train" is anchored to the flagship @useavalon/avalon
#   package's next patch version, e.g. stable 0.1.92 -> train v0.1.93.
# - Each merge publishes an incrementing pre-release: v0.1.93-canary.0,
#   v0.1.93-canary.1, ... All canaries appear on the GitHub Releases page as
#   pre-releases; the stable release keeps the "Latest" badge in the sidebar.
# - When a stable 0.1.93 ships, the train advances to v0.1.94-canary.0.
# - Each changed package publishes its own npm version under the canary tag,
#   sharing the same -canary.N suffix.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish a canary for (manual run)"
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - lit
          - react
          - preact
          - svelte
          - solid
          - vue
          - qwik

permissions:
  contents: write
  id-token: write

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.resolve.outputs.core }}
      lit: ${{ steps.resolve.outputs.lit }}
      react: ${{ steps.resolve.outputs.react }}
      preact: ${{ steps.resolve.outputs.preact }}
      svelte: ${{ steps.resolve.outputs.svelte }}
      solid: ${{ steps.resolve.outputs.solid }}
      vue: ${{ steps.resolve.outputs.vue }}
      qwik: ${{ steps.resolve.outputs.qwik }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            core:
              - 'packages/avalon/**'
              - 'packages/integrations/core/**'
            lit:
              - 'packages/integrations/lit/**'
            react:
              - 'packages/integrations/react/**'
            preact:
              - 'packages/integrations/preact/**'
            svelte:
              - 'packages/integrations/svelte/**'
            solid:
              - 'packages/integrations/solid/**'
            vue:
              - 'packages/integrations/vue/**'
            qwik:
              - 'packages/integrations/qwik/**'
      - name: Resolve publish targets
        id: resolve
        env:
          # Empty on push; the selected option on manual dispatch.
          SELECTION: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          declare -A VAL
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: honor the selected package (or "all").
            for p in core lit react preact svelte solid vue qwik; do
              if [ "$SELECTION" = "all" ] || [ "$SELECTION" = "$p" ]; then
                VAL[$p]=true
              else
                VAL[$p]=false
              fi
            done
          else
            # Push run: mirror the paths-filter results (default missing → false).
            VAL[core]='${{ steps.changes.outputs.core || 'false' }}'
            VAL[lit]='${{ steps.changes.outputs.lit || 'false' }}'
            VAL[react]='${{ steps.changes.outputs.react || 'false' }}'
            VAL[preact]='${{ steps.changes.outputs.preact || 'false' }}'
            VAL[svelte]='${{ steps.changes.outputs.svelte || 'false' }}'
            VAL[solid]='${{ steps.changes.outputs.solid || 'false' }}'
            VAL[vue]='${{ steps.changes.outputs.vue || 'false' }}'
            VAL[qwik]='${{ steps.changes.outputs.qwik || 'false' }}'
          fi

          ANY=false
          for p in core lit react preact svelte solid vue qwik; do
            echo "${p}=${VAL[$p]}" >> "$GITHUB_OUTPUT"
            if [ "${VAL[$p]}" = "true" ]; then ANY=true; fi
          done
          echo "any=${ANY}" >> "$GITHUB_OUTPUT"

  canary:
    name: Publish Canary
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Compute canary train and counter
        id: train
        run: |
          # Anchor the release train to the flagship @useavalon/avalon next patch.
          AVALON_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/avalon/package.json','utf-8')).version.split('-')[0])")
          next_patch() {
            local base="$1"
            local maj min pat
            IFS=. read -r maj min pat <<< "$base"
            echo "${maj}.${min}.$((pat + 1))"
          }
          TRAIN="v$(next_patch "$AVALON_VERSION")"

          # Determine the next canary counter. The counter must be greater than
          # any -canary.N already PUBLISHED to npm (the source of truth) as well
          # as any existing git tag. Deriving from npm makes the workflow robust
          # to partial failures: if a previous run published some packages but
          # failed before tagging, we still advance past the published versions
          # instead of colliding (npm 403 "cannot publish over existing version").
          git fetch --tags --force --quiet

          # Highest N among existing git tags for this train.
          TAG_N=$(git tag --list "${TRAIN}-canary.*" \
            | sed -E "s/.*-canary\.//" \
            | sort -n | tail -1)
          [ -z "$TAG_N" ] && TAG_N=-1

          # Highest published canary N for a package, matching its own canary
          # base version (next patch of its current stable). Persisted canaries
          # from older trains use a different base, so they're correctly ignored.
          max_published_n() {
            local cfg="$1"
            [ -f "$cfg" ] || { echo -1; return; }
            local name base
            name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$cfg','utf-8')).name)")
            base=$(node -e "
              const v = JSON.parse(require('fs').readFileSync('$cfg','utf-8')).version.split('-')[0];
              const [a, b, c] = v.split('.').map(Number);
              console.log(\`\${a}.\${b}.\${c + 1}\`);
            ")
            npm view "$name" versions --json 2>/dev/null | node -e "
              const base = process.argv[1];
              let s = '';
              process.stdin.on('data', (d) => (s += d)).on('end', () => {
                let v;
                try { v = JSON.parse(s); } catch { v = []; }
                if (!Array.isArray(v)) v = v ? [v] : [];
                const re = new RegExp('^' + base.replace(/\./g, '\\\\.') + '-canary\\\\.(\\\\d+)\$');
                const ns = v.map((x) => { const m = re.exec(x); return m ? +m[1] : -1; }).filter((n) => n >= 0);
                console.log(ns.length ? Math.max(...ns) : -1);
              });
            " "$base"
          }

          MAX="$TAG_N"
          for CFG in \
            packages/avalon/package.json \
            packages/integrations/core/package.json \
            packages/integrations/lit/package.json \
            packages/integrations/react/package.json \
            packages/integrations/preact/package.json \
            packages/integrations/svelte/package.json \
            packages/integrations/solid/package.json \
            packages/integrations/vue/package.json \
            packages/integrations/qwik/package.json; do
            PUB_N=$(max_published_n "$CFG")
            if [ "$PUB_N" -gt "$MAX" ]; then MAX="$PUB_N"; fi
          done

          N=$((MAX + 1))

          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "counter=$N" >> "$GITHUB_OUTPUT"
          echo "tag=${TRAIN}-canary.${N}" >> "$GITHUB_OUTPUT"
          echo "Release train: ${TRAIN}-canary.${N}"

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.AVALON_RELEASE }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Bump and publish changed packages
        run: |
          N="${{ steps.train.outputs.counter }}"

          next_patch() {
            local base="$1"
            local maj min pat
            IFS=. read -r maj min pat <<< "$base"
            echo "${maj}.${min}.$((pat + 1))"
          }

          publish_pkg() {
            local CONFIG="$1"
            if [ ! -f "$CONFIG" ]; then
              return
            fi
            BASE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CONFIG','utf-8')).version.split('-')[0])")
            CANARY_VERSION="$(next_patch "$BASE_VERSION")-canary.${N}"
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('$CONFIG','utf-8'));
              config.version = '${CANARY_VERSION}';
              fs.writeFileSync('$CONFIG', JSON.stringify(config, null, '\t') + '\n');
            "
            PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CONFIG','utf-8')).name)")
            # Idempotency safety net: never attempt to publish over an existing
            # version (npm returns 403). The counter is computed to avoid this,
            # but a re-run of the same commit could otherwise collide.
            if npm view "${PKG_NAME}@${CANARY_VERSION}" version >/dev/null 2>&1; then
              echo "Skip: ${PKG_NAME}@${CANARY_VERSION} already published"
              return
            fi
            echo "Publishing ${PKG_NAME}@${CANARY_VERSION}"
            PKG_DIR=$(dirname "$CONFIG")
            cd "$PKG_DIR"
            npm publish --tag canary --access public
            cd - > /dev/null
          }

          if [ "${{ needs.detect-changes.outputs.core }}" = "true" ]; then
            publish_pkg "packages/integrations/core/package.json"
            publish_pkg "packages/avalon/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.lit }}" = "true" ]; then
            publish_pkg "packages/integrations/lit/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.react }}" = "true" ]; then
            publish_pkg "packages/integrations/react/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.preact }}" = "true" ]; then
            publish_pkg "packages/integrations/preact/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.svelte }}" = "true" ]; then
            publish_pkg "packages/integrations/svelte/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.solid }}" = "true" ]; then
            publish_pkg "packages/integrations/solid/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.vue }}" = "true" ]; then
            publish_pkg "packages/integrations/vue/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.qwik }}" = "true" ]; then
            publish_pkg "packages/integrations/qwik/package.json"
          fi

      - name: Create canary tag and GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.train.outputs.tag }}"
          # Tag the released commit (do not commit the canary version bumps to main).
          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --prerelease
