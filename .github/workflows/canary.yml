name: Canary Release

# Publishes canary releases only for packages that actually changed.
# Canary versions look like: 0.1.1-canary.20260209.abc1234

on:
  push:
    branches: [main]
    paths:
      - "packages/**"

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      lit: ${{ steps.changes.outputs.lit }}
      react: ${{ steps.changes.outputs.react }}
      preact: ${{ steps.changes.outputs.preact }}
      svelte: ${{ steps.changes.outputs.svelte }}
      solid: ${{ steps.changes.outputs.solid }}
      vue: ${{ steps.changes.outputs.vue }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            core:
              - 'packages/avalon/**'
              - 'packages/integrations/shared/**'
            lit:
              - 'packages/integrations/lit/**'
            react:
              - 'packages/integrations/react/**'
            preact:
              - 'packages/integrations/preact/**'
            svelte:
              - 'packages/integrations/svelte/**'
            solid:
              - 'packages/integrations/solid/**'
            vue:
              - 'packages/integrations/vue/**'

  canary:
    name: Publish Canary
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Generate canary suffix
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "suffix=canary.${DATE}.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump and publish changed packages
        run: |
          SUFFIX="${{ steps.version.outputs.suffix }}"

          publish_pkg() {
            local CONFIG="$1"
            if [ -f "$CONFIG" ]; then
              BASE_VERSION=$(node -e "const c = JSON.parse(require('fs').readFileSync('$CONFIG', 'utf-8')); console.log(c.version.split('-')[0])")
              node -e "
                const fs = require('fs');
                const config = JSON.parse(fs.readFileSync('$CONFIG', 'utf-8'));
                config.version = '${BASE_VERSION}-${SUFFIX}';
                fs.writeFileSync('$CONFIG', JSON.stringify(config, null, '\t') + '\n');
              "
              PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CONFIG', 'utf-8')).name)")
              echo "Publishing ${PKG_NAME}@${BASE_VERSION}-${SUFFIX}"
              PKG_DIR=$(dirname "$CONFIG")
              cd "$PKG_DIR"
              npm publish --dry-run --tag canary
              cd -
            fi
          }

          if [ "${{ needs.detect-changes.outputs.core }}" = "true" ]; then
            publish_pkg "packages/avalon/package.json"
            publish_pkg "packages/integrations/shared/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.lit }}" = "true" ]; then
            publish_pkg "packages/integrations/lit/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.react }}" = "true" ]; then
            publish_pkg "packages/integrations/react/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.preact }}" = "true" ]; then
            publish_pkg "packages/integrations/preact/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.svelte }}" = "true" ]; then
            publish_pkg "packages/integrations/svelte/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.solid }}" = "true" ]; then
            publish_pkg "packages/integrations/solid/package.json"
          fi
          if [ "${{ needs.detect-changes.outputs.vue }}" = "true" ]; then
            publish_pkg "packages/integrations/vue/package.json"
          fi

      # Uncomment when ready to actually publish (replace --dry-run with real publish):
      # Change `npm publish --dry-run` to `npm publish --access public` above
      # And add NPM_TOKEN secret to the environment
