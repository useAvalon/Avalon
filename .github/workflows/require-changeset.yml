# Fails when publishable package source changes without a new changeset file.
# Escape hatch: add the "no changeset" label (docs-only / internal refactors).
name: Require changeset

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset:
    # Version packages PRs consume changesets (delete .changeset/*.md, bump package.json).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: publishable
        with:
          filters: |
            packages:
              - 'packages/**'
              - '!packages/**/__tests__/**'
              - '!packages/**/tests/**'
              - '!packages/**/*.test.ts'
              - '!packages/**/*.test.tsx'
              - '!packages/**/*.test.mjs'
              - '!packages/**/README.md'

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47
        id: changeset-files
        with:
          files: |
            .changeset/*.md

      - name: Require changeset for package changes
        env:
          HAS_PUBLISHABLE: ${{ steps.publishable.outputs.packages }}
          HAS_CHANGESET: ${{ steps.changeset-files.outputs.any_changed }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.title }}" = "release: version packages" ]; then
            echo "Skipped: automated Version packages PR."
            exit 0
          fi
          if [ "$HAS_PUBLISHABLE" != "true" ]; then
            echo "No publishable package source changes — changeset not required."
            exit 0
          fi
          if echo "$LABELS" | grep -q 'no changeset'; then
            echo "Skipped: PR has 'no changeset' label."
            exit 0
          fi
          if [ "$HAS_CHANGESET" = "true" ]; then
            echo "Changeset file present."
            exit 0
          fi
          echo "::error::Publishable files under packages/ changed without a changeset. Run bunx changeset and commit .changeset/*.md, or add the no changeset label if npm should not change."
          exit 1
