# Pending changesets on main → Version packages PR. Merging that PR → build, publish, tags, GitHub Releases.
# Lint/test/typecheck/install-smoke run in ci.yml on every PR (including Version packages) before merge.
name: Release

on:
  push:
    branches: [main]

# Run after/before Deploy www on the same ref — one heavy main job at a time (runner queue).
concurrency:
  group: ship-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository_owner == 'useAvalon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: npm install -g npm@^11.5.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build packages with a build script
        run: bun run build:packages

      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "release: version packages"
          pr-title: "release: version packages"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
