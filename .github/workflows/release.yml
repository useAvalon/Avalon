name: Release

# Publish beta, rc, and stable releases from the GitHub Actions UI.
# Do not npm publish from a laptop — this workflow is the only stable path.
#
# Every channel runs lint, unit tests, typecheck, and `bun run test:install`
# (pack → create-avalon --yes → install → build) before `npm publish`.
# A failed install smoke blocks the release.
# Already-published versions are skipped. A failed publish does not
# commit the bump — retry with the same bump so those versions finish.
# An unscoped 403 (create-avalon missing a trusted publisher) fails the
# job the same way; do not tag a half release.
#
# Examples:
#   package=core,  channel=beta  → auto-detects bump from commits
#   package=lit,   channel=stable, bump-override=major → forces major bump
#   package=all,   channel=stable → auto-detects bump for all packages
#   package=core,  bump-override=none → publish versions already in package.json
#   dry-run=true (default) → bump + smoke + npm publish --dry-run, no git push

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - core
          - create-avalon
          - lit
          - react
          - preact
          - svelte
          - solid
          - vue
          - qwik
          - mcp
          - all
      bump-override:
        description: "Version bump override (auto = detect from commits)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - none
          - patch
          - minor
          - major
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
          - rc
      dry-run:
        description: "Dry run (no actual publish)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx biome ci .
      - run: bunx vitest run
      - run: bunx tsc --noEmit

  release:
    name: Release ${{ inputs.package }} (${{ inputs.channel }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Trusted publishing needs npm 11.5.1+. Node 22 ships an older CLI.
      - run: npm install -g npm@^11.5.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect semver bump
        id: detect-bump
        run: |
          PACKAGE="${{ inputs.package }}"
          OVERRIDE="${{ inputs.bump-override }}"

          # If override is set, skip detection. `none` publishes the
          # versions already in package.json without incrementing.
          if [ "$OVERRIDE" != "auto" ]; then
            echo "bump=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "reason=manual override ($OVERRIDE)" >> "$GITHUB_OUTPUT"
            echo "::notice::Detected bump: $OVERRIDE (manual override)"
            exit 0
          fi

          # Find the last release tag for this package
          if [ "$PACKAGE" = "core" ]; then
            # Core uses avalon/v* or core/v* tags
            LAST_TAG=$(git tag --list 'avalon/v*' --list 'core/v*' --sort=-v:refname | head -n 1)
          elif [ "$PACKAGE" = "all" ]; then
            # For "all", use the most recent tag across all packages
            LAST_TAG=$(git tag --sort=-creatordate | grep -E '^(avalon|core|lit|react|preact|svelte|solid|vue|qwik)/v' | head -n 1)
          else
            # Integration packages use <name>/v* tags
            LAST_TAG=$(git tag --list "${PACKAGE}/v*" --sort=-v:refname | head -n 1)
          fi

          # Get commits since last tag (or all commits if no tag exists)
          if [ -z "$LAST_TAG" ]; then
            echo "::notice::No previous release tag found for '$PACKAGE'. Defaulting to minor."
            COMMITS=$(git log --oneline)
            FULL_COMMITS=$(git log --format="%B---COMMIT_SEPARATOR---")
          else
            echo "::notice::Last release tag: $LAST_TAG"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline)
            FULL_COMMITS=$(git log "${LAST_TAG}..HEAD" --format="%B---COMMIT_SEPARATOR---")
          fi

          if [ -z "$COMMITS" ]; then
            echo "::notice::No new commits since last release. Defaulting to patch."
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "reason=no new commits since $LAST_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump level from conventional commits
          BUMP="patch"
          REASON=""

          # Check for BREAKING CHANGE in commit bodies/footers or ! suffix
          BREAKING=$(echo "$FULL_COMMITS" | grep -iE '^BREAKING CHANGE:|^BREAKING-CHANGE:' || true)
          BREAKING_BANG=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ (feat|fix|chore|ci|docs|style|refactor|perf|test|build|revert)(\(.*\))?!:' || true)

          if [ -n "$BREAKING" ] || [ -n "$BREAKING_BANG" ]; then
            BUMP="major"
            if [ -n "$BREAKING_BANG" ]; then
              REASON=$(echo "$BREAKING_BANG" | head -n 1 | sed 's/^[a-f0-9]* //')
            else
              REASON="BREAKING CHANGE found in commit body"
            fi
          elif echo "$COMMITS" | grep -qE '^[a-f0-9]+ feat(\(.*\))?:'; then
            BUMP="minor"
            REASON=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ feat(\(.*\))?:' | head -n 1 | sed 's/^[a-f0-9]* //')
          else
            REASON=$(echo "$COMMITS" | head -n 1 | sed 's/^[a-f0-9]* //')
          fi

          # Handle first release (no tag) — default to minor
          if [ -z "$LAST_TAG" ] && [ "$BUMP" = "patch" ]; then
            BUMP="minor"
            REASON="first release (no previous tag)"
          fi

          # Sanitize REASON (derived from arbitrary commit messages) to a single
          # line of printable chars before writing it to GITHUB_OUTPUT. This
          # prevents both output-injection (extra keys via newlines) and shell
          # injection when the value is later consumed.
          REASON=$(printf '%s' "$REASON" | tr -d '\r\n' | tr -cd '[:print:]' | cut -c1-200)
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected bump: $BUMP (based on: $REASON)"

      - name: Print detected bump
        # Pass expressions through env, never interpolate ${{ }} into the shell
        # script — `reason` comes from untrusted commit messages.
        env:
          BUMP: ${{ steps.detect-bump.outputs.bump }}
          REASON: ${{ steps.detect-bump.outputs.reason }}
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║ Detected bump: $BUMP"
          echo "║ Based on: $REASON"
          echo "╚══════════════════════════════════════════════════╝"

      - name: Bump version
        if: ${{ steps.detect-bump.outputs.bump != 'none' }}
        run: |
          bun run scripts/bump-version.ts \
            --bump=${{ steps.detect-bump.outputs.bump }} \
            --channel=${{ inputs.channel }} \
            --package=${{ inputs.package }}

      - name: Resolve publish targets
        id: targets
        run: |
          case "${{ inputs.package }}" in
            core)
              echo "packages=packages/integrations/core packages/avalon packages/integrations/preact packages/seo packages/create-avalon" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "packages=packages/integrations/core packages/avalon packages/create-avalon packages/seo packages/agent-optimization packages/integrations/lit packages/integrations/react packages/integrations/preact packages/integrations/svelte packages/integrations/solid packages/integrations/vue packages/integrations/qwik" >> "$GITHUB_OUTPUT"
              ;;
            mcp)
              echo "packages=packages/mcp" >> "$GITHUB_OUTPUT"
              ;;
            create-avalon)
              echo "packages=packages/create-avalon" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "packages=packages/integrations/${{ inputs.package }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install smoke (scaffold + build from packed tarballs)
        run: bun run test:install

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry-run == true }}
        run: |
          for pkg in ${{ steps.targets.outputs.packages }}; do
            if [ -f "$pkg/package.json" ]; then
              echo "[DRY RUN] Publishing $pkg..."
              cd "$pkg"
              npm publish --dry-run
              cd -
            fi
          done

      - name: Publish to npm
        if: ${{ inputs.dry-run == false }}
        id: publish
        run: |
          # A token in .npmrc / NODE_AUTH_TOKEN wins over OIDC and hides
          # trusted publishing. Leave both unset.
          unset NODE_AUTH_TOKEN NPM_TOKEN
          rm -f ~/.npmrc
          TAG="${{ inputs.channel }}"
          if [ "$TAG" = "stable" ]; then
            TAG="latest"
          fi
          # Bun's process.execPath is not Node, so npm is not a sibling of the
          # runtime binary. Pass the setup-node npm explicitly.
          export NPM_BIN="$(command -v npm)"
          if [ ! -x "$NPM_BIN" ]; then
            echo "::error::npm is not on PATH"
            exit 1
          fi
          bun scripts/publish-packages.ts --tag "$TAG" -- ${{ steps.targets.outputs.packages }}

      - name: Commit version bump
        # success() keeps a failed publish from pushing the bump. Retry
        # with the same bump; versions already on npm are skipped.
        if: ${{ success() && inputs.dry-run == false && steps.publish.outputs.commit == 'true' }}
        run: |
          # Safety: remove any leftover publish backups so they are not committed
          find packages -name "package.json.bak" -delete
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "release: ${{ inputs.package }} (${{ inputs.channel }}) [skip ci]"
            git push
          fi

      - name: Create per-package tags and GitHub Releases
        if: ${{ success() && inputs.dry-run == false && steps.publish.outputs.commit == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.channel }}" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          for pkg in ${{ steps.targets.outputs.packages }}; do
            if [ ! -f "$pkg/package.json" ]; then
              continue
            fi
            NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$pkg/package.json','utf-8')).name)")
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$pkg/package.json','utf-8')).version)")
            # Short name without the @useavalon/ scope, e.g. @useavalon/avalon -> avalon
            SHORT_NAME="${NAME##*/}"
            TAG_NAME="${SHORT_NAME}/v${VERSION}"

            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists — skipping"
              continue
            fi

            echo "Creating release $NAME@$VERSION (tag $TAG_NAME)"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"

            gh release create "$TAG_NAME" \
              --title "${NAME}@${VERSION}" \
              --generate-notes \
              $PRERELEASE_FLAG
          done
