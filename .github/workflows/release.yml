name: Release

# Manual workflow for publishing beta, rc, and stable releases.
# Supports releasing individual packages or everything at once.
#
# Examples:
#   package=core,  channel=beta,  bump=minor → @avalon/avalon@0.2.0-beta.1
#   package=lit,   channel=stable, bump=patch → @avalon/lit@0.1.1
#   package=all,   channel=stable, bump=major → all packages to 1.0.0

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - core
          - lit
          - react
          - preact
          - svelte
          - solid
          - vue
          - all
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
          - rc
      dry-run:
        description: "Dry run (no actual publish)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release ${{ inputs.package }} (${{ inputs.channel }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          deno run --allow-read --allow-write scripts/bump-version.ts \
            --bump=${{ inputs.bump }} \
            --channel=${{ inputs.channel }} \
            --package=${{ inputs.package }}

      - name: Resolve publish targets
        id: targets
        run: |
          case "${{ inputs.package }}" in
            core)
              echo "packages=packages/avalon packages/integrations/shared" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "packages=packages/avalon packages/integrations/shared packages/integrations/lit packages/integrations/react packages/integrations/preact packages/integrations/svelte packages/integrations/solid packages/integrations/vue" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "packages=packages/integrations/${{ inputs.package }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish to JSR (dry run)
        if: ${{ inputs.dry-run == true }}
        run: |
          for pkg in ${{ steps.targets.outputs.packages }}; do
            if [ -f "$pkg/deno.json" ]; then
              echo "[DRY RUN] Publishing $pkg..."
              deno publish --dry-run --allow-dirty --config "$pkg/deno.json"
            fi
          done

      - name: Publish to JSR
        if: ${{ inputs.dry-run == false }}
        run: |
          TAG="${{ inputs.channel }}"
          if [ "$TAG" = "stable" ]; then
            TAG="latest"
          fi
          for pkg in ${{ steps.targets.outputs.packages }}; do
            if [ -f "$pkg/deno.json" ]; then
              echo "Publishing $pkg with tag $TAG..."
              deno publish --allow-dirty --config "$pkg/deno.json" --tag "$TAG"
            fi
          done

      - name: Read version for tag
        id: new-version
        run: |
          # Use the first target package to get the version
          FIRST_PKG=$(echo "${{ steps.targets.outputs.packages }}" | awk '{print $1}')
          VERSION=$(deno eval "const c = JSON.parse(Deno.readTextFileSync('${FIRST_PKG}/deno.json')); console.log(c.version)")
          NAME=$(deno eval "const c = JSON.parse(Deno.readTextFileSync('${FIRST_PKG}/deno.json')); console.log(c.name)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: ${{ inputs.dry-run == false }}
        run: |
          git add -A
          git commit -m "release: ${{ steps.new-version.outputs.name }}@${{ steps.new-version.outputs.version }}"
          git push

      - name: Create git tag
        if: ${{ inputs.dry-run == false }}
        run: |
          TAG_NAME="${{ inputs.package }}/v${{ steps.new-version.outputs.version }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.package }}/v${{ steps.new-version.outputs.version }}"
          name: "${{ steps.new-version.outputs.name }}@${{ steps.new-version.outputs.version }}"
          prerelease: ${{ inputs.channel != 'stable' }}
          generate_release_notes: true
