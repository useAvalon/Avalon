name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One workflow run per ref; cancel superseded pushes. Lint → test → typecheck → install-smoke
# run in sequence (needs:) so only one heavy job uses a runner at a time on Free orgs.
# The changeset job is PR-only and only needs prepare — it does not sit in that chain.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    steps:
      - run: true

  changeset:
    name: changeset
    needs: prepare
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: publishable
        with:
          predicate-quantifier: every
          filters: |
            packages:
              - 'packages/**'
              - '!packages/**/__tests__/**'
              - '!packages/**/tests/**'
              - '!packages/**/*.test.ts'
              - '!packages/**/*.test.tsx'
              - '!packages/**/*.test.mjs'
              - '!packages/**/README.md'

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47
        id: changeset-files
        with:
          files: |
            .changeset/*.md

      - name: Require changeset for package changes
        env:
          HAS_PUBLISHABLE: ${{ steps.publishable.outputs.packages }}
          HAS_CHANGESET: ${{ steps.changeset-files.outputs.any_changed }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.title }}" = "release: version packages" ]; then
            echo "Skipped: automated Version packages PR."
            exit 0
          fi
          if [ "$HAS_PUBLISHABLE" != "true" ]; then
            echo "No publishable package source changes — changeset not required."
            exit 0
          fi
          if echo "$LABELS" | grep -q 'no changeset'; then
            echo "Skipped: PR has 'no changeset' label."
            exit 0
          fi
          if [ "$HAS_CHANGESET" = "true" ]; then
            echo "Changeset file present."
            exit 0
          fi
          echo "::error::Publishable files under packages/ changed without a changeset. Run bunx changeset and commit .changeset/*.md, or add the no changeset label if npm should not change."
          exit 1

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx biome ci .

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun --bun x vitest run

  typecheck:
    name: Type Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc --noEmit

  install-smoke:
    name: Install smoke
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test:install
