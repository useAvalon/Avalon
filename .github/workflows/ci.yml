name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One runner for all checks (Free org pools are often 1–2 concurrent jobs). On PRs, share
# the group with changeset + Deploy www so those workflows do not compete for the same slots.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - name: Lint
        run: bunx biome ci .

      - name: Test
        run: bun --bun x vitest run

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Install smoke
        run: bun run test:install
