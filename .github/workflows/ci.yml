name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One job per ref — extra workflows on the same push were starving each other for runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        if: github.event_name == 'pull_request'
        id: publishable
        with:
          predicate-quantifier: every
          filters: |
            packages:
              - 'packages/**'
              - '!packages/**/__tests__/**'
              - '!packages/**/tests/**'
              - '!packages/**/*.test.ts'
              - '!packages/**/*.test.tsx'
              - '!packages/**/*.test.mjs'
              - '!packages/**/README.md'

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47
        if: github.event_name == 'pull_request'
        id: changeset-files
        with:
          files: |
            .changeset/*.md

      - name: Require changeset for package changes
        if: github.event_name == 'pull_request'
        env:
          HAS_PUBLISHABLE: ${{ steps.publishable.outputs.packages }}
          HAS_CHANGESET: ${{ steps.changeset-files.outputs.any_changed }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.title }}" = "release: version packages" ]; then
            echo "Skipped: automated Version packages PR."
            exit 0
          fi
          if [ "$HAS_PUBLISHABLE" != "true" ]; then
            echo "No publishable package source changes — changeset not required."
            exit 0
          fi
          if echo "$LABELS" | grep -q 'no changeset'; then
            echo "Skipped: PR has 'no changeset' label."
            exit 0
          fi
          if [ "$HAS_CHANGESET" = "true" ]; then
            echo "Changeset file present."
            exit 0
          fi
          echo "::error::Publishable files under packages/ changed without a changeset. Run bunx changeset and commit .changeset/*.md, or add the no changeset label if npm should not change."
          exit 1

      - run: bun install

      - name: Lint
        run: bunx biome ci .

      - name: Test
        run: bun --bun x vitest run

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Install smoke
        run: bun run test:install
