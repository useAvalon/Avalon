# Publishes pkg.pr.new previews when the PR has the "pr preview" label (not npm).
# Requires the pkg.pr.new GitHub App on useAvalon/Avalon.
# The default StackBlitz project installs every package into one npm project, which cannot resolve
# (Vite 8 for Avalon vs the Vite <8 peer of @builder.io/qwik), so it is replaced by ./examples/*,
# small apps that depend only on the packages they use.
# The PR comment is off: its "Open in StackBlitz" link installs every package into one npm project,
# which cannot resolve (Vite 8 for Avalon vs the Vite <8 peer of @builder.io/qwik). Install URLs are
# in the job log and the "Continuous Releases" check.
name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'pr preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Workspace packages export TypeScript sources; the build (with its rewritten package.json kept) points them at dist so the
      # previews install and run under Node (which refuses to strip types inside node_modules).
      - run: bun scripts/build-packages.ts --keep-manifest

      - name: Publish package previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx pkg-pr-new publish --bun --compact --no-template --template './examples/*' './packages/*' './packages/integrations/*'
