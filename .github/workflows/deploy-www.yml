name: Deploy www

# Builds the docs/marketing site and deploys to Cloudflare Pages.
# Production: push to main. Preview: pull requests from this repo.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Account → Cloudflare Pages (edit) + Account Settings (read)
#   CLOUDFLARE_ACCOUNT_ID  Right sidebar of the Cloudflare dashboard

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-www.yml"
  pull_request:
    branches: [main]
    paths:
      - "www/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-www.yml"

concurrency:
  group: deploy-www-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      # Cloudflare worker cannot boot under Node for post-build prerender (rolldown WASI bindings).
      # Prerender with node_server, then merge HTML into the Cloudflare Pages output.
      - name: Prerender www (node preset)
        working-directory: www
        env:
          NITRO_PRESET: node_server
        run: bun run build

      - name: Stash node preset client output
        working-directory: www
        env:
          PRERENDER_STASH: ${{ runner.temp }}/avalon-prerender-html
        run: |
          set -euo pipefail
          rm -rf "$PRERENDER_STASH"
          mkdir -p "$PRERENDER_STASH/client"
          # Prerender HTML and its /assets/* hashes must come from the same build.
          if [ -d .output/public ]; then
            rsync -a .output/public/ "$PRERENDER_STASH/client/"
          fi
          if [ -d dist ]; then
            rsync -a dist/ "$PRERENDER_STASH/client/"
          fi
          html_count="$(find "$PRERENDER_STASH/client" -type f -name '*.html' | wc -l | tr -d ' ')"
          if [ "$html_count" = "0" ]; then
            echo "::error::node_server build did not produce any prerendered HTML."
            ls -la dist .output/public 2>/dev/null || true
            exit 1
          fi
          asset_count="$(find "$PRERENDER_STASH/client/assets" -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "Stashed ${html_count} HTML file(s) and ${asset_count} asset file(s) from node preset."

      - name: Clean www output before Cloudflare build
        working-directory: www
        run: rm -rf dist .output .netlify

      - name: Build www (Cloudflare Pages)
        working-directory: www
        env:
          NITRO_PRESET: cloudflare_pages
          AVALON_SKIP_PRERENDER: "1"
        run: bun run build

      - name: Merge node client output into Cloudflare dist
        working-directory: www
        env:
          PRERENDER_STASH: ${{ runner.temp }}/avalon-prerender-html
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a --exclude '_worker.js' "$PRERENDER_STASH/client/" dist/
          bun -e "
          import { patchCloudflareRoutesAfterPrerender } from '@useavalon/avalon/post-build';
          patchCloudflareRoutesAfterPrerender(process.cwd());
          "

      - name: Verify Pages HTML artifact
        working-directory: www
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing after prerender merge."
            exit 1
          fi
          if [ ! -f dist/_routes.json ]; then
            echo "::error::dist/_routes.json missing after build."
            exit 1
          fi
          if ! grep -q '"exclude".*"/"' dist/_routes.json; then
            echo "::warning::Expected static-first _routes.json exclude for / when index.html is present."
          fi
          css="$(find dist/assets -maxdepth 1 -name 'ssr-index-*.css' -print | head -1)"
          if [ -z "$css" ]; then
            echo "::error::Expected ssr-index-*.css in dist/assets after merge."
            exit 1
          fi
          echo "Prerendered HTML and matching assets merged into Cloudflare dist."

      # bunx, not wrangler-action install: `npm i` inside www/ fails on workspace:^ deps.
      # Project `useavalon` already exists in the Cloudflare account — do not call
      # `pages project create` (it is not idempotent and logs a scary 8000002 error).
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
        run: |
          set -euo pipefail
          out=$(bunx wrangler@4 pages deploy --project-name=useavalon --branch="$PAGES_BRANCH" 2>&1 | tee /dev/stderr)
          # Unique per-deploy URL (…hash….useavalon.pages.dev)
          url=$(printf '%s\n' "$out" | grep -Eo 'https://[a-zA-Z0-9.-]+\.useavalon\.pages\.dev' | head -1 || true)
          # Stable branch alias when Wrangler prints one
          alias_url=$(printf '%s\n' "$out" | grep -i 'alias URL' | grep -Eo 'https://[a-zA-Z0-9.-]+\.useavalon\.pages\.dev' | head -1 || true)
          {
            echo "url=${url}"
            echo "alias_url=${alias_url:-$url}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "- **Deployment:** ${url:-_(none)_}"
            if [ -n "${alias_url:-}" ] && [ "${alias_url}" != "${url}" ]; then
              echo "- **Branch alias:** ${alias_url}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- avalon-cloudflare-pages-preview -->'
          body=$(cat <<EOF
          ${marker}
          ### Cloudflare Pages preview

          | | |
          | --- | --- |
          | **This deploy** | ${PREVIEW_URL} |
          | **Branch alias** | ${ALIAS_URL} |

          _Updated for \`${HEAD_SHA}\`_
          EOF
          )
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -1 || true)
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
