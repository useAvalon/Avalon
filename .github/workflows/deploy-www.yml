name: Deploy www

# Builds the docs/marketing site and deploys to Cloudflare Pages.
# Production: push to main. PR Cloudflare preview: add the "pr preview" label (same as pkg.pr.new Preview).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Pages → Edit, Account Settings → Read, Zone → Cache Purge → Edit;
#                          add Zone → Read only when CLOUDFLARE_ZONE_ID is unset (zone list fallback)
#   CLOUDFLARE_ACCOUNT_ID  Account Home → right sidebar (not the same as a zone / domain ID)
# Recommended (skips zone list API; same zone as manual Prefix purge):
#   CLOUDFLARE_ZONE_ID     Website → useavalon.dev → Overview → API → Zone ID

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      # Workspace packages linked from www/package.json (not the whole monorepo).
      - "packages/avalon/**"
      - "packages/seo/**"
      - "packages/agent-optimization/**"
      - "packages/integrations/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-www.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      # PR previews: site + lockfiles only. Workflow/ci edits skip Pages (still deploy on merge to main).
      - "www/**"
      - "bun.lock"
      - "package.json"
      - "www/package.json"

concurrency:
  group: deploy-www-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'pr preview'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      # Cloudflare worker cannot boot under Node for post-build prerender (rolldown WASI bindings).
      # Prerender with node_server, then merge HTML into the Cloudflare Pages output.
      - name: Prerender www (node preset)
        working-directory: www
        env:
          NITRO_PRESET: node_server
          AVALON_SITE_URL: https://useavalon.dev
        run: |
          echo "AVALON_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "AVALON_CONTENT_MODIFIED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          bun run build

      - name: Stash node preset client output
        working-directory: www
        env:
          PRERENDER_STASH: ${{ runner.temp }}/avalon-prerender-html
        run: |
          set -euo pipefail
          rm -rf "$PRERENDER_STASH"
          mkdir -p "$PRERENDER_STASH/client"
          # Prerender HTML and its /assets/* hashes must come from the same build.
          if [ -d .output/public ]; then
            rsync -a .output/public/ "$PRERENDER_STASH/client/"
          fi
          if [ -d dist ]; then
            rsync -a dist/ "$PRERENDER_STASH/client/"
          fi
          html_count="$(find "$PRERENDER_STASH/client" -type f -name '*.html' | wc -l | tr -d ' ')"
          if [ "$html_count" = "0" ]; then
            echo "::error::node_server build did not produce any prerendered HTML."
            ls -la dist .output/public 2>/dev/null || true
            exit 1
          fi
          asset_count="$(find "$PRERENDER_STASH/client/assets" -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "Stashed ${html_count} HTML file(s) and ${asset_count} asset file(s) from node preset."

      - name: Clean www output before Cloudflare build
        working-directory: www
        run: rm -rf dist .output .netlify

      - name: Build www (Cloudflare Pages)
        working-directory: www
        env:
          NITRO_PRESET: cloudflare_pages
          AVALON_SKIP_PRERENDER: "1"
        run: bun run build

      - name: Merge node client output into Cloudflare dist
        working-directory: www
        env:
          PRERENDER_STASH: ${{ runner.temp }}/avalon-prerender-html
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a --exclude '_worker.js' "$PRERENDER_STASH/client/" dist/
          bun -e "
          import { join } from 'node:path';
          import {
            optimizePrerenderedHtml,
            patchCloudflareRoutesAfterPrerender,
          } from '@useavalon/avalon/post-build';
          const cwd = process.cwd();
          patchCloudflareRoutesAfterPrerender(cwd);
          optimizePrerenderedHtml(cwd, join(cwd, 'dist'));
          "

      - name: Build Pagefind index on merged dist
        working-directory: www
        run: |
          set -euo pipefail
          bunx pagefind --site dist
          test -f dist/pagefind/pagefind.js
          test -f dist/pagefind/pagefind-component-ui.js
          test -f dist/pagefind/pagefind-component-ui.css

      - name: Verify Pages HTML artifact
        working-directory: www
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing after prerender merge."
            exit 1
          fi
          if [ ! -f dist/404.html ]; then
            echo "::error::dist/404.html missing (Cloudflare Pages SPA fallback prevention)."
            exit 1
          fi
          if [ ! -f dist/_routes.json ]; then
            echo "::error::dist/_routes.json missing after build."
            exit 1
          fi
          if ! grep -q '"exclude".*"/"' dist/_routes.json; then
            echo "::warning::Expected static-first _routes.json exclude for / when index.html is present."
          fi
          css="$(find dist/assets -maxdepth 1 -name 'ssr-index-*.css' -print | head -1)"
          if [ -z "$css" ]; then
            echo "::error::Expected ssr-index-*.css in dist/assets after merge."
            exit 1
          fi
          if ! grep -q 'wasm-unsafe-eval' dist/_headers; then
            echo "::error::dist/_headers missing wasm-unsafe-eval in CSP."
            exit 1
          fi
          html_no_noscript="$(perl -0777 -pe 's/<noscript>[\s\S]*?<\/noscript>//g' dist/index.html)"
          if printf '%s' "$html_no_noscript" | grep -q 'onload="this.onload=null;this.rel=.stylesheet.'; then
            echo "::error::dist/index.html defers ssr-index CSS via preload onload (causes FOUC/CLS)."
            exit 1
          fi
          if ! grep -q 'data-inlined-from="/assets/ssr-index-' dist/index.html; then
            if ! printf '%s' "$html_no_noscript" | grep -q 'rel="stylesheet" href="/assets/ssr-index-'; then
              echo "::error::dist/index.html missing inlined or blocking ssr-index stylesheet."
              exit 1
            fi
          fi
          if ! grep -q '/pagefind/\*' dist/_headers; then
            echo "::error::dist/_headers missing /pagefind/* CSP block."
            exit 1
          fi
          echo "Prerendered HTML and matching assets merged into Cloudflare dist."

      # bunx, not wrangler-action install: `npm i` inside www/ fails on workspace:^ deps.
      # Project `useavalon` already exists in the Cloudflare account — do not call
      # `pages project create` (it is not idempotent and logs a scary 8000002 error).
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
        run: |
          set -euo pipefail
          out=$(bunx wrangler@4 pages deploy --project-name=useavalon --branch="$PAGES_BRANCH" 2>&1 | tee /dev/stderr)
          # Unique per-deploy URL (…hash….useavalon.pages.dev)
          url=$(printf '%s\n' "$out" | grep -Eo 'https://[a-zA-Z0-9.-]+\.useavalon\.pages\.dev' | head -1 || true)
          # Stable branch alias when Wrangler prints one
          alias_url=$(printf '%s\n' "$out" | grep -i 'alias URL' | grep -Eo 'https://[a-zA-Z0-9.-]+\.useavalon\.pages\.dev' | head -1 || true)
          {
            echo "url=${url}"
            echo "alias_url=${alias_url:-$url}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "- **Deployment:** ${url:-_(none)_}"
            if [ -n "${alias_url:-}" ] && [ "${alias_url}" != "${url}" ]; then
              echo "- **Branch alias:** ${alias_url}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Custom domain (useavalon.dev) can keep stale edge objects after deploy while
      # *.pages.dev serves fresh assets — Pagefind worker scripts cache response headers.
      - name: Purge production CDN cache for Pagefind
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          zone_id="${CLOUDFLARE_ZONE_ID:-}"
          if [ -z "$zone_id" ]; then
            lookup=""
            lookup_status=0
            lookup=$(curl -sS \
              "https://api.cloudflare.com/client/v4/zones?name=useavalon.dev&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}") || lookup_status=$?
            if [ "$lookup_status" -ne 0 ]; then
              echo "::warning::Skipping CDN purge (curl ${lookup_status}): zone lookup failed. Set CLOUDFLARE_ZONE_ID or purge Prefix useavalon.dev/pagefind/ manually."
              exit 0
            fi
            if [ "$(printf '%s' "$lookup" | jq -r '.success')" != "true" ]; then
              code=$(printf '%s' "$lookup" | jq -r '.errors[0].code // "unknown"')
              msg=$(printf '%s' "$lookup" | jq -r '.errors[0].message // .')
              echo "::warning::Skipping CDN purge (${code}): ${msg}. Set CLOUDFLARE_ZONE_ID (+ Cache Purge on the zone) or purge Prefix useavalon.dev/pagefind/ manually."
              exit 0
            fi
            zone_id=$(printf '%s' "$lookup" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$zone_id" ]; then
            echo "::warning::No Cloudflare zone for useavalon.dev in this account; skipping CDN purge."
            exit 0
          fi
          payload=$(jq -n --arg prefix 'useavalon.dev/pagefind' '{prefixes: [$prefix]}')
          response=""
          purge_status=0
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload") || purge_status=$?
          if [ "$purge_status" -ne 0 ]; then
            echo "::warning::Skipping CDN purge (curl ${purge_status}): purge request failed. Deploy succeeded; purge Prefix useavalon.dev/pagefind/ manually if needed."
            exit 0
          fi
          if [ "$(printf '%s' "$response" | jq -r '.success')" != "true" ]; then
            code=$(printf '%s' "$response" | jq -r '.errors[0].code // "unknown"')
            msg=$(printf '%s' "$response" | jq -r '.errors[0].message // .')
            echo "::warning::CDN purge failed (${code}): ${msg}. Deploy succeeded; purge Prefix useavalon.dev/pagefind/ in the dashboard if search CSP looks stale."
            exit 0
          fi
          echo "Purged CDN prefix useavalon.dev/pagefind on zone ${zone_id}."

      - name: Verify production Pagefind CSP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sleep 3
          for path in /pagefind/pagefind-worker.js /pagefind/pagefind.js; do
            csp=$(curl -fsSI "https://useavalon.dev${path}" | tr -d '\r' | grep -i '^content-security-policy:' | head -1 || true)
            echo "${path}: ${csp:-<missing>}"
            if ! printf '%s' "$csp" | grep -q 'wasm-unsafe-eval'; then
              echo "::error::Production ${path} missing wasm-unsafe-eval (stale CDN cache or wrong origin)."
              exit 1
            fi
          done

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- avalon-cloudflare-pages-preview -->'
          body=$(cat <<EOF
          ${marker}
          ### Cloudflare Pages preview

          | | |
          | --- | --- |
          | **This deploy** | ${PREVIEW_URL} |
          | **Branch alias** | ${ALIAS_URL} |

          _Updated for \`${HEAD_SHA}\`_
          EOF
          )
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -1 || true)
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
