[build]
  base = "www/"
  command = "bun install && bun build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "latest"
  NITRO_PRESET = "netlify"

[dev]
  command = "bunx --bun vite"
  targetPort = 8012
  autoLaunch = false

# SSR catch-all: routes non-static requests to the Nitro function.
# netlify.toml [[redirects]] with status 200 checks for a matching
# static file first (unlike _redirects which shadows them).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
