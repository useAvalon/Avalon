[build]
  base = "www/"
  command = "bun install && bun build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "latest"
  NITRO_PRESET = "netlify"

[dev]
  command = "bunx --bun vite"
  targetPort = 8012
  autoLaunch = false

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "none"

# Prerendered HTML — cache at CDN edge, revalidate on deploy.
# Netlify automatically purges CDN cache on each deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=31536000"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=31536000"

# Island JS uses clean paths (no content hash) — must revalidate.
[[headers]]
  for = "/islands/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SSR fallback for non-static routes (e.g. /demo/data-fetching, /api/*).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
