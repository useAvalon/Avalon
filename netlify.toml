[build]
  # Build from repo root so workspace: dependencies resolve correctly.
  # Netlify runs `bun install` from `base`, so it must be the monorepo root.
  command = "cd www && bunx --bun vite build && node post-build.mjs"
  publish = "www/dist"
  functions = "www/.netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.9"
  NITRO_PRESET = "netlify"

# Catch-all rewrite: serve static files first, then fall through to SSR function.
# The function name is "server" (from server.mjs entry point).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
