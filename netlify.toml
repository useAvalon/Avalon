[build]
  base = "www/"
  command = "bunx --bun vite build && node post-build.mjs"
  publish = "dist"
  functions = ".netlify/functions-internal"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- www/"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.9"
  NITRO_PRESET = "netlify"

# Catch-all rewrite: serve static files first, then fall through to SSR function.
# The function name is "server" (from server.mjs entry point).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
