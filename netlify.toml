[build]
  base = "www/"
  command = "bun install && bun build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "latest"
  NITRO_PRESET = "netlify"

[dev]
  command = "bunx --bun vite"
  targetPort = 8012
  autoLaunch = false

[functions]
  directory = "netlify/functions"

# SSR is handled automatically by Nitro's v1 function at
# .netlify/v1/functions/server/ with preferStatic: true.
# No explicit redirect needed — Netlify discovers v1 functions
# and routes non-static requests to them automatically.
