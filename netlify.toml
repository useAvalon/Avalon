[build]
  base = "www/"
  command = "bun install && bun build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "latest"
  NITRO_PRESET = "netlify_edge"

[dev]
  command = "bunx --bun vite"
  targetPort = 8012
  autoLaunch = false

# Edge functions are configured via .netlify/edge-functions/manifest.json
# generated by Nitro at build time. The manifest routes "/*" to the
# "server" edge function with preferStatic-like excludedPath rules.
# No explicit [[redirects]] or [functions] section needed — the manifest
# handles routing and Netlify serves static files from the publish dir first.
