[build]
  base = "www/"
  command = "bun install && bun build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "latest"
  NITRO_PRESET = "netlify"

[dev]
  command = "bunx --bun vite"
  targetPort = 8012
  autoLaunch = false

[functions]
  directory = "netlify/functions"

# SSR catch-all — serves the Nitro function for any route that doesn't
# match a static file. force=false (the default in netlify.toml) means
# Netlify checks for a matching static/prerendered file FIRST. Only
# requests with no static file hit the function.
# In _redirects, 200 rewrites shadow static files — that's why we use
# netlify.toml instead.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
