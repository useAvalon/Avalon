[build]
  base = "www/"
  command = "bunx --bun vite build && mkdir -p .netlify/v1/functions && cp -r .netlify/functions-internal/server .netlify/v1/functions/server"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- www/"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.9"
  NITRO_PRESET = "netlify"
